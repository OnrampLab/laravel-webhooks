version: 2.1

jobs:
  test:
    parameters:
      php:
        type: string
      laravel:
        type: string
      lowest:
        type: boolean
        default: false
      lint:
        type: boolean
        default: false
    working_directory: ~/app
    docker:
      - image: cimg/php:<< parameters.php >>
    steps:
      - checkout
      - restore_cache:
          key: composer-v2-<< parameters.php >>-<< parameters.laravel >>-<< parameters.lowest >>-{{ checksum "composer.json" }}
      - run:
          name: Install composer packages (Laravel << parameters.laravel >>)
          command: |
            export LINT=<<# parameters.lint >>1<</ parameters.lint >><<^ parameters.lint >>0<</ parameters.lint >>
            export LOWEST=<<# parameters.lowest >>1<</ parameters.lowest >><<^ parameters.lowest >>0<</ parameters.lowest >>
            tools/scripts/ci-install.sh "<< parameters.laravel >>"
      - save_cache:
          key: composer-v2-<< parameters.php >>-<< parameters.laravel >>-<< parameters.lowest >>-{{ checksum "composer.json" }}
          paths:
            - ~/.cache/composer
      - run:
          name: Test
          command: |
            vendor/bin/phpunit -d memory_limit=386M
      - when:
          condition: << parameters.lint >>
          steps:
            - run:
                name: Install phpDocumentor
                command: |
                  sudo wget -O phive.phar https://phar.io/releases/phive.phar
                  sudo wget -O phive.phar.asc https://phar.io/releases/phive.phar.asc
                  sudo gpg --keyserver hkps://keys.openpgp.org --recv-keys 0x9D8A98B29B2D5D79
                  sudo gpg --verify phive.phar.asc phive.phar
                  sudo chmod +x phive.phar
                  sudo mv phive.phar /usr/local/bin/phive

                  phive install --force-accept-unsigned --trust-gpg-keys 67F861C3D889C656 phpDocumentor
            - run:
                name: PHPCS report (non-blocking)
                command: |
                  tools/scripts/phpcs-all-files.sh
            - run:
                name: PHP insights report (non-blocking)
                command: |
                  composer insights || echo "phpinsights below thresholds (non-blocking)"
            - run:
                name: Run rector
                command: |
                  composer rector
            - run:
                name: Do static analysis
                command: |
                  vendor/bin/phpstan
            - run:
                name: Build Documents
                command: |
                  composer docs
            - store_artifacts:
                path: ./build/api/

filters: &filters
  tags:
    only: /^v.*/
  branches:
    only: /.*/

workflows:
  version: 2
  build-deploy:
    jobs:
      - test:
          name: php80-laravel8
          php: "8.0"
          laravel: "^8.0"
          filters: *filters
      - test:
          name: php80-laravel8-lowest
          php: "8.0"
          laravel: "^8.0"
          lowest: true
          filters: *filters
      - test:
          name: php81-laravel9
          php: "8.1"
          laravel: "^9.0"
          filters: *filters
      - test:
          name: php81-laravel10
          php: "8.1"
          laravel: "^10.0"
          filters: *filters
      - test:
          name: php82-laravel11
          php: "8.2"
          laravel: "^11.0"
          filters: *filters
      - test:
          name: php83-laravel12
          php: "8.3"
          laravel: "^12.0"
          filters: *filters
      - test:
          name: php84-laravel13
          php: "8.4"
          laravel: "^13.0"
          lint: true
          filters: *filters
      - test:
          name: php85-laravel13
          php: "8.5"
          laravel: "^13.0"
          filters: *filters
