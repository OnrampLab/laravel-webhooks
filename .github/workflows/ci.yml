name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.lowest && ' (lowest)' || '' }}${{ matrix.lint && ' + lint' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.0", laravel: "^8.0" }
          - { php: "8.0", laravel: "^8.0", lowest: true }
          - { php: "8.1", laravel: "^9.0" }
          - { php: "8.1", laravel: "^10.0" }
          - { php: "8.2", laravel: "^11.0" }
          - { php: "8.3", laravel: "^12.0" }
          - { php: "8.4", laravel: "^13.0", lint: true }
          - { php: "8.5", laravel: "^13.0" }
    env:
      LINT: ${{ matrix.lint && '1' || '0' }}
      LOWEST: ${{ matrix.lowest && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
          tools: ${{ matrix.lint && 'composer, phive' || 'composer' }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # The key is computed before ci-install.sh rewrites composer.json.
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ env.LOWEST }}-${{ env.LINT }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Install composer packages
        run: tools/scripts/ci-install.sh "${{ matrix.laravel }}"

      - name: Test
        run: vendor/bin/phpunit

      - name: Run rector
        if: matrix.lint
        run: composer rector

      - name: Static analysis
        if: matrix.lint
        run: vendor/bin/phpstan --no-progress

      - name: PHPCS report (non-blocking)
        if: matrix.lint
        run: tools/scripts/phpcs-all-files.sh

      - name: PHP insights report (non-blocking)
        if: matrix.lint
        continue-on-error: true
        run: composer insights

      - name: Build documents
        if: matrix.lint
        env:
          # phive queries api.github.com for releases; unauthenticated calls
          # from shared runners hit the rate limit (HTTP 403).
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          phive install --force-accept-unsigned --trust-gpg-keys 67F861C3D889C656,6DA3ACC4991FFAE5 phpDocumentor
          composer docs

      - name: Upload documents
        if: matrix.lint
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: build/api/
